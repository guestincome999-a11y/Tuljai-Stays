name: Format phase branch

on:
  push:
    branches:
      - 'codex/phase-1-5-completion'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npx prettier --write "**/*.{ts,tsx,js,json,md,yml,yaml,css}"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Repository already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format phase branch [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
